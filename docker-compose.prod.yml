# GymOS — production overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Named explicitly, because docker-compose.override.yml is applied automatically and this one is
# not. That asymmetry is deliberate: forgetting a flag gives you the development stack on a
# laptop, never the development stack in production.
#
# ── What this overlay does ────────────────────────────────────────────────────────────────────
# Removes: every published database port, every development credential, every convenience.
# Requires: real secrets, supplied by the environment. Every ${VAR:?...} below aborts the whole
# command if unset, so a missing secret is a five-second failure at deploy time rather than a
# service running with a signing key someone found in a compose file.
#
# ── What this overlay is not ──────────────────────────────────────────────────────────────────
# This is a single-host deployment, appropriate for a small production or a staging box. It has no
# TLS termination, no horizontal scaling, and no rolling deploy — put a reverse proxy in front
# (Azure Front Door, Caddy, an ingress controller) and set GYMOS_FORWARDED_HEADERS_ENABLED=true so
# the rate limiter and audit trail see real client addresses. The service definitions are shaped so
# that moving to Azure Container Apps or Kubernetes is a translation of this file, not a redesign:
# one image, configuration entirely through environment variables, health endpoints that map
# directly onto readiness and liveness probes.

services:
  mssql:
    environment:
      MSSQL_SA_PASSWORD: '${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set for production}'

      # Developer is free for non-production use only. A deployment serving real users must set
      # this to the edition it is licensed for — Standard, Enterprise, or an Express instance
      # accepting the 10 GB cap. Unset it and the container would run Developer edition in
      # production, which is a licence violation rather than a technical fault, so it is guarded
      # like a secret.
      MSSQL_PID: '${MSSQL_PID:?MSSQL_PID must be set for production (Standard, Enterprise, or Express)}'

    # Deliberately empty: it overrides the override file's published port, so the database is
    # reachable only from the compose network. Nothing on the host, and nothing else on the host's
    # network, can open a connection to it. Administer it with
    # `docker compose exec mssql /opt/mssql-tools18/bin/sqlcmd` or over an SSH tunnel.
    ports: []

    # A managed database (Azure SQL Database, AD-11) is the better answer for anything with real
    # users: backups, point-in-time restore, patching, and failover stop being someone's weekend.
    # When that happens, delete this service and db-init, point ConnectionStrings__Database at the
    # managed instance, and apply docs/runbooks/managed-sqlserver-roles.md once. Nothing else in
    # this file changes.
    #
    # No shm_size. PostgreSQL needed it raised because it uses System V shared memory for parallel
    # workers and hash joins, and Docker's 64 MB default silently capped them; SQL Server manages
    # its own buffer pool inside the process and is bounded by the memory limit below instead.

    deploy:
      resources:
        limits:
          # A bound, so a runaway query cannot starve the API on the same host. Raise it for real
          # workloads — this is sized for a small deployment, not chosen by measurement.
          #
          # SQL Server refuses to start with less than 2 GB available, so unlike the PostgreSQL
          # service this replaces, this limit has a hard floor rather than only a sensible one.
          memory: ${MSSQL_MEMORY_LIMIT:-4g}
        reservations:
          memory: 2g

  db-init:
    environment:
      MSSQL_SA_PASSWORD: '${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set for production}'
      # Read by docker/sqlserver/initdb/10-principals.sql, to create the two principals the
      # application actually connects as. Guarded the same way: a missing secret is a five-second
      # failure at deploy time, not a login created with no password.
      GYMOS_MIGRATOR_PASSWORD: '${GYMOS_MIGRATOR_PASSWORD:?GYMOS_MIGRATOR_PASSWORD must be set for production}'
      GYMOS_APP_PASSWORD: '${GYMOS_APP_PASSWORD:?GYMOS_APP_PASSWORD must be set for production}'

  api:
    # Pinned rather than built. Production should run the artefact CI produced and tested, not one
    # compiled on the deployment host from whatever happens to be checked out there.
    image: '${API_IMAGE:?API_IMAGE must be set for production, e.g. ghcr.io/gymos-management/gymos-api:0.7.0}'
    build: !reset null

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # gymos_app, not sa: it owns nothing and holds no DDL or security-administration rights, so it
      # cannot disable a security policy even given an SQL injection. See
      # docker/sqlserver/initdb/10-principals.sql. TenantIsolationValidator refuses to boot if this
      # connection turns out to be privileged, so a misconfiguration here is a failed deploy rather
      # than a silent loss of tenant isolation.
      GYMOS_APP_PASSWORD: '${GYMOS_APP_PASSWORD:?GYMOS_APP_PASSWORD must be set for production}'

      # Encrypt=True and NO TrustServerCertificate: the certificate is verified for real. That is
      # the one difference from the development connection string, and it is the difference between
      # an encrypted channel and an authenticated one. Against Azure SQL the certificate chains to a
      # public CA and this simply works; against a self-hosted instance, install a real certificate
      # rather than reaching for TrustServerCertificate here.
      ConnectionStrings__Database: >-
        Server=${MSSQL_HOST:-mssql},${MSSQL_PORT_INTERNAL:-1433};Database=${GYMOS_DB:-gymos};User
        Id=gymos_app;Password=${GYMOS_APP_PASSWORD};Encrypt=True;TrustServerCertificate=False;Current
        Language=us_english

      # Startup validates this is at least 32 bytes and refuses to boot otherwise, so a weak value
      # fails immediately rather than issuing forgeable tokens.
      #   openssl rand -base64 48
      Security__Jwt__SigningKey: '${GYMOS_JWT_SIGNING_KEY:?GYMOS_JWT_SIGNING_KEY must be set — generate with openssl rand -base64 48}'

      # Machine-readable, because in production these lines are read by a collector, not a person.
      Serilog__ConsoleFormat: json
      Serilog__MinimumLevel__Default: ${GYMOS_LOG_LEVEL:-Information}

      # Off. Applying migrations as a side effect of a container start means two replicas can
      # migrate the same database concurrently, and a failed migration takes out the thing that was
      # supposed to report the failure. Run them as a one-shot step before the deployment — see
      # DOCKER.md, "Production workflow".
      Database__MigrateOnStartup: 'false'

      # Nothing by default: production administrators are created deliberately, not seeded by a
      # container. Set both only for the very first deployment of a new environment.
      Seed__SuperAdmin__Email: ${GYMOS_SEED_ADMIN_EMAIL:-}
      Seed__SuperAdmin__Password: ${GYMOS_SEED_ADMIN_PASSWORD:-}

    ports:
      # Bound to the loopback interface by default, because the only thing that should reach the
      # API directly is a reverse proxy on the same host. Set API_BIND=0.0.0.0 knowingly, and only
      # behind a firewall.
      - '${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080'

    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}
        reservations:
          memory: 256m

    # No development tooling reaches production: mailpit exists only in
    # docker-compose.override.yml, which is not applied here. That is why they live there.

  migrator:
    # Same treatment as api, and for the same reason: pinned rather than built, so what runs the
    # migration is the artefact CI tested, not a local build. It also must resolve to the same
    # image as api — build: !reset null on both is what makes that true, since the base file's
    # migrator service otherwise carries its own `build:` and would be built locally while api is
    # pulled, running a different image with no error to show for it.
    image: '${API_IMAGE:?API_IMAGE must be set for production, e.g. ghcr.io/gymos-management/gymos-api:0.7.0}'
    build: !reset null

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # gymos_migrator owns the schemas and everything migrations create — see
      # docker/sqlserver/initdb/10-principals.sql. Guarded the same way as every other production
      # secret.
      GYMOS_MIGRATOR_PASSWORD: '${GYMOS_MIGRATOR_PASSWORD:?GYMOS_MIGRATOR_PASSWORD must be set for production}'
      ConnectionStrings__Database: >-
        Server=${MSSQL_HOST:-mssql},${MSSQL_PORT_INTERNAL:-1433};Database=${GYMOS_DB:-gymos};User
        Id=gymos_migrator;Password=${GYMOS_MIGRATOR_PASSWORD};Encrypt=True;TrustServerCertificate=False;Current
        Language=us_english

      # Machine-readable, matching api: these lines are read by a collector, not a person.
      Serilog__ConsoleFormat: json
      Serilog__MinimumLevel__Default: ${GYMOS_LOG_LEVEL:-Information}

networks:
  gymos-data:
    # No route out. The database, and anything else on this network, cannot reach the internet —
    # so a compromised dependency inside one of them has nowhere to send what it finds. The API
    # bridges both networks and is the only path between them.
    internal: true
