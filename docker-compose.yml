# GymOS — base stack definition.
#
#   Development:   docker compose up -d                            (adds docker-compose.override.yml)
#   Production:    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ── What belongs in this file ──────────────────────────────────────────────────────────────────
# Everything true of GymOS in *every* environment: which services exist, how they find each
# other, what makes them healthy, and what they store. Nothing environment-specific — no
# published host ports, no credentials, no development tooling. Those live in the overlay files,
# which is what stops "works on my machine" from being a property of the base definition.
#
# ── This file is not a runnable stack on its own ───────────────────────────────────────────────
# It intentionally carries no credentials, so `docker compose -f docker-compose.yml up` alone would
# start SQL Server with an empty sa password, which the image refuses to boot with at all. Always
# pair it with an overlay — the development one is applied automatically, so in practice this only
# matters if you pass -f by hand.
#
# Full reference, including the reasoning behind each security setting:
#   docs/Infrastructure/DOCKER.md
name: gymos

# ══════════════════════════════════════════════════════════════════════════════════════════════
# Shared fragments
# ══════════════════════════════════════════════════════════════════════════════════════════════

# Every container gets the same log configuration. Without a cap, a container that starts
# log-looping fills the host disk and takes down everything else on it — including the database.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
    # Docker's json-file driver wraps each line; the application already emits structured JSON
    # (Serilog CompactJsonFormatter), so a collector reading these files gets structured events
    # without a parsing step. See Serilog__ConsoleFormat in .env.example.

# Applied to every service. Locking these down centrally means a new service is secure because
# it inherited the default, not because someone remembered.
x-hardening: &default-hardening
  security_opt:
    # Blocks setuid binaries from gaining privileges — a container process can never end up with
    # more rights than it started with, even if something inside it is exploitable.
    - no-new-privileges:true
  cap_drop:
    # Start from nothing and add back only what a service demonstrably needs. The default Docker
    # capability set includes things like NET_RAW that no GymOS service has any use for.
    - ALL

services:
  # ════════════════════════════════════════════════════════════════════════════════════════════
  # SQL Server 2022 — the only stateful service
  # ════════════════════════════════════════════════════════════════════════════════════════════
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gymos-mssql
    restart: unless-stopped
    logging: *default-logging

    environment:
      ACCEPT_EULA: 'Y'
      # sa is the bootstrap login the image creates, and it exists here for exactly two things:
      # db-init runs the initialisation scripts as it, and a human can use it to debug the
      # container. The application never connects as it — sysadmin and db_owner both hold
      # ALTER ANY SECURITY POLICY, so a connection using either could switch R14's tenant isolation
      # off in one statement, and TenantIsolationValidator refuses to boot such a host. See
      # docker/sqlserver/initdb/10-principals.sql for the two principals actually used.
      #
      # Empty default, and the requirement lives in the overlays rather than here. Compose
      # interpolates each file *independently* before merging them, so a `${VAR:?}` marker in this
      # file cannot be satisfied by an override supplying the value — it aborts the whole command
      # even when the merged result would be correct. So: dev supplies a known-public value,
      # docker-compose.prod.yml uses `${MSSQL_SA_PASSWORD:?}` and refuses to start without a real
      # one, and this file stays merge-safe. GYMOS_MIGRATOR_PASSWORD and GYMOS_APP_PASSWORD, read
      # by 10-principals.sql, follow the identical pattern.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}

      # Developer edition: free for non-production use and feature-identical to Enterprise, which
      # matters here because table partitioning and row-level security must behave in development
      # exactly as they do on the Azure SQL production target. Express would silently cap the
      # database at 10 GB. The production overlay sets this to the licensed edition.
      MSSQL_PID: ${MSSQL_PID:-Developer}

      # UTC, matching AD-40: the application stores UTC and converts at the edges, so a database in
      # any other zone would only create a second, disagreeing opinion about "now". The clock
      # SqlServerDatabaseClock reads is SYSUTCDATETIME(), which is UTC whatever this says — this
      # keeps the engine's own logs and any SYSDATETIME() a human types agreeing with it.
      TZ: UTC

      # The collation the *instance* is created with. Databases override it explicitly
      # (00-database.sql), so this only governs tempdb and system databases — but a mismatch
      # between tempdb and a user database makes every temp-table join throw a collation-conflict
      # error, so they are kept the same on purpose.
      MSSQL_COLLATION: Latin1_General_100_CI_AS

    volumes:
      # /var/opt/mssql holds the data files, the transaction log, and the error log. The image
      # declares it owned by the unprivileged `mssql` user (uid 10001), so a fresh named volume
      # inherits that ownership and nothing has to chown it at boot — which is what lets this
      # service keep `cap_drop: ALL` with no capabilities added back, unlike the PostgreSQL service
      # it replaces.
      - mssql-data:/var/opt/mssql

      # No init-script mount: the SQL Server image has no /docker-entrypoint-initdb.d equivalent.
      # Initialisation is the db-init service below. See docker/sqlserver/initdb/README.md.

    healthcheck:
      # A real query, not a port probe. The engine accepts TCP connections seconds before it will
      # answer a query, and the whole point of this check is that db-init and the migrator wait for
      # a *usable* server — the same reason the PostgreSQL check passed -U and -d rather than
      # calling bare pg_isready.
      #
      # -C trusts the self-signed certificate the container generates. -b makes sqlcmd exit
      # non-zero on error, without which the check would report healthy on a failed query.
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" > /dev/null',
        ]
      interval: 10s
      timeout: 5s
      # SQL Server is slower to first-answer than PostgreSQL — first boot creates the system
      # databases — so the window is wider than the 60s the PostgreSQL service allowed.
      retries: 12
      start_period: 45s

    <<: *default-hardening
    cap_add:
      # The `sqlservr` binary carries the NET_BIND_SERVICE file capability
      # (`getcap` reports `cap_net_bind_service=ep`). Executing a file whose capabilities fall outside
      # the container's bounding set fails with EPERM *before the process starts*, so with
      # `cap_drop: ALL` alone the container crash-loops printing
      # `/opt/mssql/bin/sqlservr: Operation not permitted` and nothing more — the same trap Seq falls
      # into, and just as unhelpful to read.
      #
      # Granting the one capability the binary declares is the narrow fix. SQL Server does not
      # actually bind a privileged port here (it listens on 1433), so this buys the image nothing at
      # runtime; it is required only to let the kernel exec the file at all.
      #
      # Still four fewer than the PostgreSQL service needed: that entrypoint added CHOWN,
      # DAC_OVERRIDE, FOWNER, SETGID and SETUID to chown its data directory and drop from root. This
      # image starts as the unprivileged `mssql` user and `/var/opt/mssql` is image-owned by it, so
      # none of those apply.
      - NET_BIND_SERVICE
    # Not read_only: the engine writes its data files, log, and several transient paths under
    # /var/opt/mssql. The data directory is a volume; the rest are not, and tmpfs-ing them all to
    # claim a read-only flag would be ceremony rather than security.

    networks:
      - gymos-data

  # Creates the database, the two principals, and the schemas — then exits. `migrator` waits for it.
  #
  # This service exists because the SQL Server image runs no initialisation scripts of its own.
  # PostgreSQL's image applies /docker-entrypoint-initdb.d once against an empty data directory;
  # there is no equivalent here, no ordering hook, and no first-boot signal. So the step is
  # explicit, and because it is explicit it also runs on every `up` — which is why every statement
  # in those scripts is guarded and re-running them is a no-op.
  #
  # It uses the SQL Server image purely for the sqlcmd binary inside it; no engine is started.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gymos-db-init
    # Not `unless-stopped`: this container is meant to exit, and restarting it would loop forever.
    restart: 'no'
    logging: *default-logging

    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      GYMOS_DB: ${GYMOS_DB:-GymOS_Local}
      GYMOS_MIGRATOR_PASSWORD: ${GYMOS_MIGRATOR_PASSWORD:-}
      GYMOS_APP_PASSWORD: ${GYMOS_APP_PASSWORD:-}

    volumes:
      # Read-only: these scripts run as sa, so the container has no reason to be able to alter them.
      - ./docker/sqlserver/initdb:/initdb:ro

    # -b so sqlcmd exits non-zero on any error, which is what makes `service_completed_successfully`
    # below mean "initialised" rather than "ran". The passwords reach the scripts as sqlcmd :setvar
    # bindings via -v, so they are substituted inside sqlcmd's own parser rather than by a shell —
    # a password containing a quote cannot terminate a string and have the rest read as SQL.
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        for script in /initdb/*.sql; do
          echo "db-init: applying $${script}"
          /opt/mssql-tools18/bin/sqlcmd \
            -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b \
            -v GYMOS_DB="$$GYMOS_DB" \
            -v GYMOS_MIGRATOR_PASSWORD="$$GYMOS_MIGRATOR_PASSWORD" \
            -v GYMOS_APP_PASSWORD="$$GYMOS_APP_PASSWORD" \
            -i "$${script}"
        done
        echo "db-init: complete"

    depends_on:
      mssql:
        condition: service_healthy

    <<: *default-hardening

    networks:
      - gymos-data

  # ════════════════════════════════════════════════════════════════════════════════════════════
  # GymOS Web API
  # ════════════════════════════════════════════════════════════════════════════════════════════
  api:
    build:
      # Repository root, because the build needs Directory.Build.props and global.json.
      context: .
      dockerfile: src/Host/GymOS.WebApi/Dockerfile
    image: ${API_IMAGE:-gymos-api:local}
    container_name: gymos-api
    restart: unless-stopped
    logging: *default-logging

    environment:
      # Configuration uses the double-underscore convention the application already reads
      # (ASP.NET maps Security__Jwt__SigningKey to Security:Jwt:SigningKey), so nothing here
      # invents a second naming scheme for the same settings.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: '8080'

      # `mssql` is the compose service name, resolved by Docker's embedded DNS on the shared
      # network. Host-based addressing is what makes the same image run unchanged against a
      # sidecar in dev and Azure SQL Database in production (AD-11).
      #
      # Encrypt=True is SqlClient's default and stays on everywhere. TrustServerCertificate is the
      # development-only half: the sidecar presents a self-signed certificate, so the development
      # overlay turns it on and docker-compose.prod.yml leaves it off — an encrypted connection
      # that trusts any certificate is not an authenticated one.
      #
      # Current Language=us_english is not cosmetic. UnitOfWork recovers the constraint name from a
      # unique-index violation by reading the server's error message, because SqlException exposes
      # it nowhere else, and SQL Server localises that message per login language.
      # SetGymFeaturesCommand retries on exactly one constraint name and must not retry on any
      # other, so the message has to be in the language the parser expects.
      ConnectionStrings__Database: >-
        Server=mssql,1433;Database=${GYMOS_DB:-GymOS_Local};User Id=gymos_app;Password=${GYMOS_APP_PASSWORD:-};Encrypt=True;TrustServerCertificate=${MSSQL_TRUST_SERVER_CERTIFICATE:-false};Current
        Language=us_english

      # ── Deliberately ABSENT from this file: Security__Jwt__SigningKey ──────────────────────
      # An empty environment variable is not an unset one, and this is where that bites. Environment
      # variables outrank appsettings.json, so declaring `Security__Jwt__SigningKey: ${VAR:-}` sets
      # it to the empty string and *overrides* the deliberately public development key in
      # appsettings.Development.json — the application then refuses to start with
      # "SigningKey field is required", in an environment specifically designed to need no secrets.
      # Discovered exactly that way. The overlays set it instead: development leaves it unset so the
      # file-based fallback applies, production requires a real value.
      #
      # The same reasoning applies to Seed__SuperAdmin__*: only the overlays declare them.
      Security__Jwt__Issuer: ${GYMOS_JWT_ISSUER:-gymos-backend}
      Security__Jwt__Audience: ${GYMOS_JWT_AUDIENCE:-gymos-clients}

      # Behind a reverse proxy (Azure Front Door, an ingress controller), this must be on or the
      # rate limiter sees one bucket for every caller and audit rows all record the proxy's
      # address. Off by default because it is only correct when a proxy is genuinely in front.
      Security__ForwardedHeaders__Enabled: ${GYMOS_FORWARDED_HEADERS_ENABLED:-false}

      # Empty means "do not export". Set to an OTLP collector to light up AD-38 tracing without
      # touching the image.
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

      # Set by the overlays (text for humans in development, json for collectors in production)
      # rather than defaulted to empty here, for the precedence reason above.
      Serilog__MinimumLevel__Default: ${GYMOS_LOG_LEVEL:-Information}

      # Hard-coded `false`, with no environment variable behind it. Migrations belong to the one-shot
      # `migrator` service below, which connects as gymos_migrator; this container connects as
      # gymos_app, which holds no DDL rights at all, so turning this on now produces a failed
      # migration rather than a migrated database.
      #
      # It used to read ${GYMOS_MIGRATE_ON_STARTUP:-false}, and that variable's value in an older
      # .env.example was `true`. A developer with a stale .env would have had this container attempt
      # DDL as gymos_app on every boot. Removing the interpolation is what makes the stale value
      # inert; the variable is gone from .env.example and DOCKER.md too, so nothing reintroduces it.
      Database__MigrateOnStartup: 'false'

    volumes:
      # ASP.NET writes DataProtection keys on start-up. With a read-only root filesystem and no
      # volume here it logs a warning and holds them in memory, so every restart invalidates
      # anything they protected. Nothing today depends on them (the API is JWT-based and
      # stateless) — this exists so that when something does, it already works.
      - api-dataprotection:/home/app/.aspnet/DataProtection-Keys
      # Reserved for the validated-upload pipeline (AD-44). Mounted now so introducing it is a
      # code change rather than an infrastructure change.
      - uploads:/var/lib/gymos/uploads

    tmpfs:
      # The only writable path the framework genuinely needs, sized so a runaway temp file cannot
      # consume host memory.
      - /tmp:size=64m,mode=1777

    # The application writes nothing else: it logs to stdout, keeps no local cache, and its
    # binaries are root-owned and therefore unwritable by the unprivileged `app` user. A read-only root filesystem
    # turns "should not write" into "cannot write".
    read_only: true

    healthcheck:
      # Duplicated from the Dockerfile's HEALTHCHECK on purpose: an image pulled from a registry
      # carries its own, but a compose file that relies on that alone stops being a complete
      # description of the stack. The definitions must agree — see docs/Infrastructure/DOCKER.md.
      test: ['CMD-SHELL', 'curl --fail --silent http://localhost:8080/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

    depends_on:
      mssql:
        # service_healthy, not service_started: the API migrates and seeds during start-up, so a
        # database that is merely *running* is not enough — a real query has to succeed first.
        condition: service_healthy
      migrator:
        # Refuses to start the API against an unmigrated database. If the migrator ever exits 0
        # after a failed migration this stops protecting anything, which is why its exit code is
        # load-bearing — see the comment in Program.cs above the Database:MigrateOnly branch.
        condition: service_completed_successfully

    <<: *default-hardening

    networks:
      # The API is the only service on both: it is reached from outside and it reaches the
      # database. See the networks section for why that separation matters.
      - gymos-edge
      - gymos-data

  # Applies migrations, then exits. `api` waits for it to succeed.
  #
  # Same image as the API, running with Database__MigrateOnly — rather than putting `dotnet ef` or a
  # migration bundle in the runtime image. It connects as gymos_migrator, which owns the schema; the
  # API connects as gymos_app, which owns nothing and therefore cannot alter a table's isolation.
  migrator:
    build:
      # Repository root, because the build needs Directory.Build.props and global.json.
      context: .
      dockerfile: src/Host/GymOS.WebApi/Dockerfile
    image: ${API_IMAGE:-gymos-api:local}
    container_name: gymos-migrator
    # Not `unless-stopped`: this container is meant to exit, and restarting it would loop forever.
    restart: 'no'
    logging: *default-logging

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Database__MigrateOnly: 'true'
      ConnectionStrings__Database: >-
        Server=mssql,1433;Database=${GYMOS_DB:-GymOS_Local};User Id=gymos_migrator;Password=${GYMOS_MIGRATOR_PASSWORD:-};Encrypt=True;TrustServerCertificate=${MSSQL_TRUST_SERVER_CERTIFICATE:-false};Current
        Language=us_english

    depends_on:
      mssql:
        condition: service_healthy
      db-init:
        # The database, the principals, and the two schemas all have to exist before a migration
        # can run: gymos_migrator is created by db-init, and the migrator authenticates as it.
        condition: service_completed_successfully

    <<: *default-hardening

    networks:
      # Copied verbatim from api, which is the only other service whose networks: block this file
      # defines. gymos-edge is unused here — nothing calls the migrator and it calls out to
      # nothing on that network — but api is the pattern to match rather than a second one to
      # invent, and being on it costs the one-shot container nothing.
      - gymos-edge
      - gymos-data

  # ════════════════════════════════════════════════════════════════════════════════════════════
  # Future services
  # ════════════════════════════════════════════════════════════════════════════════════════════
  #
  # Each is defined behind a `profiles:` key, so it is inert until asked for:
  #     docker compose --profile redis --profile observability up -d
  #
  # Profiles rather than commented-out YAML, deliberately. A commented block is not parsed, so it
  # rots quietly and nobody discovers the indentation error until the day they need the service.
  # These are validated by `docker compose config` on every run, and they are structured — the
  # right network, the shared hardening, a health check — so adding one is a matter of turning it
  # on rather than designing it under pressure.

  redis:
    image: redis:7-alpine
    container_name: gymos-redis
    profiles: ['redis']
    restart: unless-stopped
    logging: *default-logging
    # --appendonly yes: durability matters the moment Redis holds anything other than a cache
    # (rate-limit counters, idempotency keys under AD-39).
    command: ['redis-server', '--appendonly', 'yes']
    # Starts directly as the image's unprivileged redis user. The default entrypoint starts as root
    # and drops privileges with setpriv, which needs SETUID/SETGID back — pointless when the
    # container can simply never be root. /data in the image is redis-owned, so a fresh named
    # volume inherits that ownership and nothing needs chowning.
    user: redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    <<: *default-hardening
    networks:
      - gymos-data

  # Structured-log sink (AD-38). The API already emits compact JSON to stdout; pointing Serilog at
  # Seq is a configuration change once this is running.
  seq:
    image: datalust/seq:latest
    container_name: gymos-seq
    profiles: ['observability']
    restart: unless-stopped
    logging: *default-logging
    environment:
      ACCEPT_EULA: 'Y'
      # Seq refuses to start without an administrator password, which is the right default for
      # something that will hold every log line the platform produces. Empty here, like MinIO's
      # root password: the development overlay supplies a public value, and any real deployment
      # supplies its own.
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-}
    # The image's /data is owned by 999, and a fresh named volume inherits that, so Seq can run as
    # its own unprivileged user from the start rather than beginning as root to chown and drop.
    user: '999:999'
    volumes:
      - seq-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://localhost:80/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *default-hardening
    cap_add:
      # Seq's binary carries the NET_BIND_SERVICE file capability so it can listen on port 80.
      # Executing a file whose capabilities are outside the container's bounding set fails with
      # EPERM, so `cap_drop: ALL` alone makes it crash-loop before it prints anything useful
      # ("/seqsvr/Seq: Operation not permitted"). Granting the one capability it declares is the
      # narrow fix; the alternative is reconfiguring it onto a high port for no benefit.
      - NET_BIND_SERVICE
    networks:
      - gymos-data

  # S3-compatible object storage, for the AD-44 file pipeline before Azure Blob Storage.
  minio:
    image: minio/minio:latest
    container_name: gymos-minio
    profiles: ['storage']
    restart: unless-stopped
    logging: *default-logging
    command: ['server', '/data', '--console-address', ':9001']
    # Runs as root, unlike every other service here, and that is a limitation of the image rather
    # than a choice: /data in minio/minio is root-owned, so a fresh named volume inherits root
    # ownership and an unprivileged user cannot write to it — fixing that needs a privileged step
    # before start-up. It keeps cap_drop: ALL and no-new-privileges, it is development-only, and it
    # is a stand-in for Azure Blob Storage (AD-44) rather than something intended for deployment.
    # If MinIO ever becomes production infrastructure, revisit this first.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gymos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *default-hardening
    networks:
      - gymos-data

  # ── Not yet defined, and deliberately so ──────────────────────────────────────────────────
  #
  # gateway        — GymOS-Gateway (AD-47). Its own repository and image; it joins gymos-edge and
  #                  talks to the API over HTTP, so adding it needs no change here.
  # worker         — background jobs (the M3.4 renewal sweep, M5 stats, audit retention). Will
  #                  run the same image as `api` with a different entrypoint, sharing its
  #                  configuration, once a job host exists to run.
  # ai-worker      — AI workloads (AD-31). Separate service because its resource profile and
  #                  failure modes have nothing in common with request handling.
  # prometheus     — scrapes the OTLP metrics AD-38 already produces.
  # grafana        — dashboards over Prometheus.
  # mailpit        — SMTP sink; belongs in the override file only, since capturing mail in
  #                  production would mean not sending it.
  #
  # A database console is deliberately NOT on this list. pgAdmin used to be, behind the `tools`
  # profile, and it cannot speak to SQL Server at all — so it is gone rather than swapped. See the
  # note where it used to be defined, in docker-compose.override.yml, for what replaced it.
  #
  # Each of these is a service block plus a profile. None requires the networks, volumes, or
  # hardening defaults above to change, which is the point of defining them centrally.

# ══════════════════════════════════════════════════════════════════════════════════════════════
# Volumes
# ══════════════════════════════════════════════════════════════════════════════════════════════
#
# Named, never host bind mounts, for three reasons: Docker manages permissions (a bind mount from
# a Windows host into a Linux container has no useful notion of the container's uid), `docker compose down`
# cannot delete them by accident, and they are the unit a backup actually operates on.
volumes:
  mssql-data:
    name: gymos-mssql-data
  api-dataprotection:
    name: gymos-api-dataprotection
  uploads:
    name: gymos-uploads

  # Declared, intentionally unmounted. The API logs to stdout — that is what makes `docker
  # compose logs`, the json-file driver, and any future collector work without the application
  # knowing they exist. A log *file* inside a container is the thing centralised logging replaces:
  # it is invisible from outside, it survives nothing, and it competes with the database for disk.
  # The volume exists so a service that genuinely produces files (a nightly export, a diagnostic
  # dump) has somewhere named to put them.
  logs:
    name: gymos-logs

  # Future services, declared so enabling a profile needs no edit here.
  redis-data:
    name: gymos-redis-data
  seq-data:
    name: gymos-seq-data
  minio-data:
    name: gymos-minio-data
  prometheus-data:
    name: gymos-prometheus-data
  grafana-data:
    name: gymos-grafana-data

# ══════════════════════════════════════════════════════════════════════════════════════════════
# Networks
# ══════════════════════════════════════════════════════════════════════════════════════════════
#
# ── Why not the default bridge ────────────────────────────────────────────────────────────────
# Docker's default bridge has no embedded DNS: containers on it can only find each other by IP or
# by the deprecated --link flag, so `Server=mssql` would not resolve. It is also shared by every
# container on the host that did not choose otherwise, which means an unrelated container is one
# `docker run` away from having a route to this database. A user-defined network gives DNS by
# service name and an isolation boundary that is ours.
#
# ── Why two of them ──────────────────────────────────────────────────────────────────────────
# `gymos-data` is marked internal in docker-compose.prod.yml, which removes its route to the
# outside world entirely — the database cannot reach the internet even if something inside it
# tries. The API sits on both networks and is the only path between them. Splitting them costs
# one line per service and turns "the database should not be exposed" from a convention into a
# property of the network.
networks:
  gymos-edge:
    name: gymos-edge
    driver: bridge
  gymos-data:
    name: gymos-data
    driver: bridge
