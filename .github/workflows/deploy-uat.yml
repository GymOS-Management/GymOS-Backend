# Deploy to UAT.
#
# STATUS: UNVERIFIED. This workflow has never run against real infrastructure, because there is none
# yet -- no Azure resources exist for GymOS at the time of writing. It is committed so the pipeline
# and its secret contract are reviewable before anyone provisions anything, not because it works.
#
# It is gated on the repository variable UAT_DEPLOY_ENABLED. Until that is set to 'true', every job
# below is skipped with a notice, so merging to `development` does not produce a red build for
# infrastructure that does not exist. Flipping the variable is what turns this on.
#
# Read docs/Infrastructure/ENVIRONMENTS.md before enabling it. The short version:
#   development -> UAT (this file)          main -> Production (deploy-production.yml)
#   UAT talks only to GymOS_UAT. It has no access to the Production connection string, because the
#   secrets live in separate GitHub Environments and this workflow only requests one of them.
name: Deploy to UAT

on:
  push:
    branches: [development]
  # Manual runs, for redeploying the same commit after an infrastructure fix.
  workflow_dispatch:

# Never two deployments to the same environment at once. Not cancel-in-progress: interrupting a
# migration halfway is worse than queueing behind it.
concurrency:
  group: deploy-uat
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # GHCR, per the image reference docker-compose.prod.yml already documents

jobs:
  # A separate job purely so the skip is visible in the UI rather than being an invisible `if` on
  # every step. A run that did nothing should say it did nothing.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ vars.UAT_DEPLOY_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UAT deployment is not enabled. Set the repository variable UAT_DEPLOY_ENABLED=true once the UAT infrastructure exists. See docs/Infrastructure/ENVIRONMENTS.md."
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit SHA, never `latest`. The Production workflow deploys a SHA that has already
      # been through UAT, and "whatever latest points at now" cannot express that.
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gymos-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Host/GymOS.WebApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

  # Migrations are their own job, before the app is deployed, and run as the migrator principal.
  # This is the same split the local stack uses: the API cannot migrate in any environment, because
  # the principal it connects as holds no DDL rights (R14).
  migrate:
    needs: [preflight, build]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: UAT # scopes the secrets below to this environment, and nothing else can request them

    # This job pulls the image `build` pushed and runs it; it never pushes one. Narrowing the
    # token to read overrides the workflow-level `packages: write`, which only `build` needs.
    permissions:
      contents: read
      packages: read
    steps:
      # Each job runs on a clean runner, so `build`'s GHCR login does not reach this one, and the
      # package is private because the repository is. Without this the `docker run` below fails
      # with `unauthorized` before a migration is attempted.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply pending migrations
        env:
          # The migrator principal, not the app principal. Set in the UAT GitHub Environment.
          MIGRATOR_CONNECTION_STRING: ${{ secrets.GYMOS_MIGRATOR_CONNECTION_STRING }}
        run: |
          set -euo pipefail

          if [ -z "${MIGRATOR_CONNECTION_STRING:-}" ]; then
            echo "::error::GYMOS_MIGRATOR_CONNECTION_STRING is not set in the UAT environment."
            exit 1
          fi

          # Fail before connecting if the string does not name GymOS_UAT. DatabaseEnvironmentGuard
          # enforces the same pairing inside the application; this catches it one step earlier, where
          # the failure is a red pipeline rather than a crash-looping container. Matched on the
          # database name only -- the string itself is never echoed, because it carries a password.
          if ! printf '%s' "$MIGRATOR_CONNECTION_STRING" | grep -qiE '(^|;)[[:space:]]*(Database|Initial Catalog)[[:space:]]*=[[:space:]]*GymOS_UAT[[:space:]]*(;|$)'; then
            echo "::error::The UAT migrator connection string does not target GymOS_UAT. Refusing to migrate."
            exit 1
          fi

          # Database:MigrateOnly is an existing host mode: apply migrations, log, exit 0. Nothing else
          # runs -- no seeding, no request serving. Reused here rather than reimplemented with
          # `dotnet ef`, so UAT applies migrations through exactly the code path local development does.
          docker run --rm \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e Database__MigrateOnly=true \
            -e ConnectionStrings__Database="$MIGRATOR_CONNECTION_STRING" \
            "${{ needs.build.outputs.image }}"

  deploy:
    needs: [preflight, build, migrate]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: UAT

    # `id-token: write` is the whole mechanism: it lets the runner ask GitHub for the short-lived
    # OIDC token azure/login exchanges. Without it there is no token to present and, now, no stored
    # secret to fall back on. Job-level rather than workflow-level, so no other job here can mint one.
    permissions:
      contents: read
      id-token: write

    steps:
      # The resource these lines name was created by hand on 2026-08-24; the workflow updates it
      # rather than creating it. Infrastructure-as-code for UAT is not in this repository, so the
      # names below are the record of what exists -- keep them in step with the resource group.
      # Fail before touching Azure if the identity is not configured, so the error names what is
      # missing instead of surfacing as an opaque az login failure. Same shape as the migrate job's
      # guards above, and for the same reason.
      - name: Verify the deployment identity is configured
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -z "${AZURE_CLIENT_ID:-}" ]; then
            echo "::error::AZURE_CLIENT_ID is not set in the UAT environment. See docs/Infrastructure/ENVIRONMENTS.md."
            exit 1
          fi

      # Federated OIDC. There is no client secret here to store, rotate, or leak: GitHub mints a
      # token for this job and Azure trusts it only for the subject
      # `repo:GymOS-Management/GymOS-Backend:environment:UAT`.
      #
      # That subject is why `environment: UAT` above is load-bearing rather than decoration -- a job
      # without it presents a different subject and Entra refuses the exchange. The three values
      # below are identifiers, not credentials; they are secrets here only to keep the tenant and
      # subscription out of logs.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Image only. Environment variables and secrets on the app -- the connection string, the JWT
      # signing key, the SuperAdmin seed -- are deployment state, not build state, and are not
      # rewritten here: a workflow that reasserted them on every push would silently undo any
      # correction made against the running app.
      #
      # The image is the SHA-tagged one `build` pushed and `migrate` has already run, so the code
      # being deployed is the code whose migrations are applied.
      - name: Deploy the image to Container Apps
        run: |
          set -euo pipefail

          az containerapp update             --name gymos-uat-api             --resource-group GymOS-UAT             --image "${{ needs.build.outputs.image }}"

      # `update` returns once the revision is accepted, not once it serves traffic. Without this the
      # smoke test races the rollout and reads the old revision's health as the new one's.
      - name: Wait for the new revision to become active
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            state=$(az containerapp revision list               --name gymos-uat-api --resource-group GymOS-UAT               --query "[?properties.active].properties.runningState" -o tsv | head -1)
            echo "attempt $attempt: runningState=${state:-unknown}"
            if [ "$state" = "Running" ]; then
              exit 0
            fi
            sleep 10
          done

          echo "::error::The new revision did not reach Running within five minutes."
          az containerapp logs show --name gymos-uat-api --resource-group GymOS-UAT --tail 100 || true
          exit 1

  smoke:
    needs: [preflight, deploy]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: UAT
    steps:
      # Readiness, not liveness. /health/ready reports unhealthy while migrations are pending, so it
      # is the endpoint that actually proves the deployment and the database agree -- /health/live
      # would pass on an app that cannot serve correct data.
      - name: Wait for readiness
        env:
          BASE_URL: ${{ vars.UAT_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_URL:-}" ]; then
            echo "::error::Repository variable UAT_BASE_URL is not set, so readiness cannot be checked."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/health/ready" || echo 000)
            echo "attempt $attempt: /health/ready -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done

          echo '::error::UAT did not become ready.'
          exit 1
