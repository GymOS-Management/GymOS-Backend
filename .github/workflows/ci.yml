name: CI

on:
  push:
    # Two long-lived branches, and `staging` is deliberately not one of them any more. The model is
    # now feature/* -> development -> main: `development` is where work lands and deploys to UAT,
    # `main` is production. `staging` sat between them as a third promotion step that nothing was
    # ever promoted through — it last moved on 13 August — and a branch that CI builds but nobody
    # merges to is a branch that goes stale and then fails confusingly. Retired rather than deleted:
    # the ref still exists, it is simply no longer part of the flow. See
    # docs/Infrastructure/ENVIRONMENTS.md.
    branches: [main, development]
  pull_request:
    # `development` is the repository's default branch, so a pull request opens against it by
    # default. Both are built, and a pull request builds and tests only — it never deploys. The two
    # deploy workflows trigger on push to these branches, which a pull request is not.
    branches: [main, development]
  workflow_dispatch: # manual "Run workflow" button — for re-runs after infra failures

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Docker available — Testcontainers integration tests run here
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore local tools (dotnet-ef)
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore GymOS.Backend.slnx

      # Full solution build BEFORE tests: `dotnet test` alone does not build the
      # host project (nothing test-side depends on it at compile time) — a broken
      # Program.cs must fail here, not hide behind green tests.
      - name: Build (full solution, warnings are errors)
        run: dotnet build GymOS.Backend.slnx --configuration Release --no-restore

      - name: Format check
        run: dotnet format GymOS.Backend.slnx --verify-no-changes --no-restore

      - name: Tests (unit + architecture + integration via Testcontainers)
        run: dotnet test GymOS.Backend.slnx --configuration Release --no-build --verbosity normal

      - name: Transitive dependency audit (banned packages)
        shell: pwsh
        run: ./build/audit-transitive-packages.ps1

      # OpenAPI breaking-change gate (AD-37/R13) is active as of M1.3 and runs inside the
      # test step above: OpenApiContractTests diffs the generated document against the
      # committed contracts/openapi-v1.json. It lives in the test suite rather than in a
      # separate CI step so it fails the same way locally as it does here.
      #
      # When it fails: regenerate and read the diff.
      #   UPDATE_OPENAPI_SNAPSHOT=1 dotnet test tests/GymOS.IntegrationTests
      #   git diff contracts/openapi-v1.json
      # Additive changes are compatible within a version; anything that removes, renames,
      # retypes, or changes the meaning of a field needs a new version instead.

  # ══════════════════════════════════════════════════════════════════════════════════════════
  # Container image and stack
  # ══════════════════════════════════════════════════════════════════════════════════════════
  #
  # A separate job, running in parallel with the tests, because it proves something the test
  # suite cannot: that the image builds from a clean checkout and that the composed stack
  # reaches a healthy, usable state with no manual step. It duplicates the compile, and that
  # is the price of catching "works with dotnet run, not in a container" here rather than at
  # deployment time.
  #
  # See docs/Infrastructure/DOCKER.md for the reasoning behind each setting asserted below.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # buildx gives the GitHub Actions cache backend, so an unchanged restore layer is
      # reused across runs. The Dockerfile's --mount=type=cache also needs BuildKit.
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # Both overlays are parsed and interpolated before anything is built: a YAML or
      # variable error should fail in seconds, not after a five-minute image build.
      - name: Validate compose files (development)
        run: docker compose config --quiet

      - name: Validate compose files (production)
        env:
          # Mixed-case with digits and symbols, because these are interpolated into a file whose
          # whole job is to be rejected when a secret is missing — and SQL Server would reject them
          # for a *different* reason (its password policy) if they were the flat lowercase strings
          # the PostgreSQL overlay used, which would make this step pass or fail for the wrong cause.
          MSSQL_SA_PASSWORD: Ci-Not-A-Real-Password1
          MSSQL_PID: Developer
          # Required by docker-compose.prod.yml rather than defaulted, so that production can never
          # inherit a local or UAT database name. Naming the Production database here is what proves
          # the requirement is satisfiable; the step asserts the file interpolates, not that this
          # database exists.
          GYMOS_DB: GymOS_Production
          GYMOS_JWT_SIGNING_KEY: ci-not-a-real-signing-key-at-least-32-bytes
          API_IMAGE: gymos-api:ci
          GYMOS_MIGRATOR_PASSWORD: Ci-Not-A-Real-Migrator1
          GYMOS_APP_PASSWORD: Ci-Not-A-Real-App1
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      # The fail-fast markers are load-bearing, so they are tested rather than trusted:
      # without secrets the production command must refuse to run at all.
      - name: Production overlay refuses to run without secrets
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null 2>&1; then
            echo '::error::Production overlay rendered with no secrets set; the ${VAR:?} guards are not working.'
            exit 1
          fi
          echo 'Production overlay aborted without secrets, as intended.'

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Host/GymOS.WebApi/Dockerfile
          tags: gymos-api:ci
          load: true # into the local daemon, so compose finds it instead of rebuilding
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No --build: compose reuses the image just loaded. This is the acceptance criterion
      # "one command to start" executed literally, from a clean checkout, with no .env file.
      - name: Start the stack (one command, no manual setup)
        env:
          API_IMAGE: gymos-api:ci
        run: docker compose up -d

      # Longer than the 5 minutes the PostgreSQL stack needed, and not by padding: SQL Server creates
      # its system databases on first boot, so the engine's own start_period is 45s before db-init
      # can even connect, and the migrator only starts after that.
      - name: Wait for health
        run: |
          for _ in $(seq 1 90); do
            api=$(docker inspect --format '{{.State.Health.Status}}' gymos-api 2>/dev/null || echo missing)
            db=$(docker inspect --format '{{.State.Health.Status}}' gymos-mssql 2>/dev/null || echo missing)
            echo "mssql=$db api=$api"
            if [ "$api" = healthy ] && [ "$db" = healthy ]; then exit 0; fi
            if [ "$api" = unhealthy ]; then break; fi
            sleep 5
          done
          echo '::error::Stack did not become healthy.'
          docker compose logs --no-color --tail 100 db-init migrator
          exit 1

      # db-init is a one-shot container, so "healthy" is the wrong question for it — the right one is
      # whether it exited 0. Asserted explicitly because everything downstream depends on it: the
      # database, both principals and the two schemas are its work, and compose's
      # service_completed_successfully gate would let a *skipped* run through unnoticed if the
      # service were ever accidentally removed from the graph.
      - name: Assert database initialisation ran and succeeded
        run: |
          set -euo pipefail
          code=$(docker inspect --format '{{.State.ExitCode}}' gymos-db-init)
          echo "db-init exit=$code"
          test "$code" = 0
          docker compose logs --no-color db-init | grep -q 'db-init: complete'

      # The stack is not merely running: the database is reachable through it, migrations
      # applied, and the seeded administrator can sign in. A health check that only proves
      # the process exists would pass on a stack nobody can use.
      - name: Smoke test
        env:
          API_PORT: 5080
        run: |
          set -euo pipefail
          live=$(curl --fail --silent --show-error http://localhost:5080/health/live)
          ready=$(curl --fail --silent --show-error http://localhost:5080/health/ready)
          echo "live=$live ready=$ready"
          case "$live$ready" in *Healthy*Healthy*) ;; *) exit 1 ;; esac
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://localhost:5080/api/v1/auth/login \
            --header 'Content-Type: application/json' \
            --data '{"email":"admin@gymos.local","password":"gymos-dev-admin-password"}')
          echo "login=$code"
          test "$code" = 200

      # Hardening is asserted, not assumed. Every line here is a decision documented in
      # DOCKER.md §7, and silently dropping one would otherwise go unnoticed.
      - name: Assert security posture
        run: |
          set -euo pipefail
          uid=$(docker compose exec -T api id -u | tr -d '\r')
          echo "api uid=$uid"; test "$uid" != 0
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' gymos-api)" = true
          test "$(docker inspect --format '{{.HostConfig.CapDrop}}' gymos-api)" = '[ALL]'
          test "$(docker inspect --format '{{.HostConfig.CapAdd}}' gymos-api)" = '[]'
          for c in gymos-api gymos-mssql gymos-db-init; do
            opts=$(docker inspect --format '{{.HostConfig.SecurityOpt}}' "$c")
            echo "$c securityOpt=$opts"
            case "$opts" in *no-new-privileges:true*) ;; *) exit 1 ;; esac
          done
          # SQL Server is on the data network only; the edge network must not reach it.
          nets=$(docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' gymos-mssql)
          echo "mssql networks=$nets"; test "$(echo "$nets" | tr -d ' ')" = gymos-data
          # SQL Server adds back exactly one, and only because the sqlservr binary carries the
          # NET_BIND_SERVICE file capability — exec fails with EPERM without it. Pinned so the list
          # cannot quietly grow. The PostgreSQL service needed five.
          test "$(docker inspect --format '{{.HostConfig.CapDrop}}' gymos-mssql)" = '[ALL]'
          test "$(docker inspect --format '{{.HostConfig.CapAdd}}' gymos-mssql)" = '[CAP_NET_BIND_SERVICE]'

      # Every optional profile is started too. Definitions that merely parse are not definitions
      # that work: Redis and Seq each crash-looped the first time they met `cap_drop: ALL`, and
      # nothing short of booting them says so. `tools` is gone from the profile list because it
      # is now empty — pgAdmin was its only service and cannot speak to SQL Server.
      - name: Start every optional profile
        env:
          API_IMAGE: gymos-api:ci
          COMPOSE_PROFILES: redis,observability,storage
        run: |
          docker compose up -d
          for _ in $(seq 1 36); do
            out=$(docker compose ps --format '{{.Name}} {{.State}} {{.Health}}' | sort)
            pending=$(printf '%s\n' "$out" | grep -vc ' running healthy$' || true)
            if [ "$pending" = 0 ]; then printf '%s\n' "$out"; exit 0; fi
            sleep 5
          done
          printf '%s\n' "$out"
          echo '::error::Not every service reached a healthy state.'
          exit 1

      # COMPOSE_PROFILES so these two see the optional services as well; `docker compose logs`
      # only reports on services its profiles select.
      - name: Container logs (on failure)
        if: failure()
        env:
          COMPOSE_PROFILES: redis,observability,storage
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        env:
          COMPOSE_PROFILES: redis,observability,storage
        run: docker compose down -v
