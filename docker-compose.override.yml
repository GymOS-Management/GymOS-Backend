# GymOS — development overrides.
#
# Compose applies this automatically, so `docker compose up -d` means "the development stack".
# Production must therefore name its files explicitly, which is the safer direction to get wrong:
# forgetting a flag gives you the hardened-but-inconvenient stack, never the reverse.
#
# ── Why every value here can be committed ─────────────────────────────────────────────────────
# The credentials below are deliberately public, identical for every developer, and useless
# anywhere else — the same treatment appsettings.Development.json already gives the local database
# password and JWT signing key. That is what makes `docker compose up -d` work from a clean clone
# with no .env file and no setup step. Any environment that is not a laptop supplies its own
# values, and docker-compose.prod.yml refuses to start without them.

# YAML anchors do not cross files — `*default-hardening` from docker-compose.yml is not visible
# here, and a service defined only in this file silently gets Docker's default capability set
# instead. That is exactly how the tooling services here ended up unhardened once; the fix is to
# repeat the anchor rather than to remember. Any service added below must reference it.
x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  mssql:
    environment:
      # Development-only. Named for what it is so it cannot be mistaken for a real secret if it
      # ever appears in a log or a screenshot.
      #
      # Longer and mixed-case than the PostgreSQL default it replaces, and not by preference: SQL
      # Server refuses to start with an sa password that fails its complexity rule (8+ characters,
      # three of upper/lower/digit/symbol), so `gymos_dev_password` would crash-loop the container
      # before it printed anything useful.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Gymos_dev_sa_password1}

    ports:
      # Published so sqlcmd, Azure Data Studio, SSMS, EF Core migrations, and container-free local
      # runs can all reach it from the host. Production publishes nothing — see
      # docker-compose.prod.yml.
      - '${MSSQL_PORT:-1433}:1433'

    # Development machines sometimes already run SQL Server (or LocalDB) on 1433; if the port is
    # taken, set MSSQL_PORT=1434 in .env rather than stopping the local service. The API is
    # unaffected — it reaches the database over the compose network, not the published port.

  db-init:
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Gymos_dev_sa_password1}
      # Read by docker/sqlserver/initdb/10-principals.sql when it creates gymos_migrator and
      # gymos_app. Must match the defaults api and migrator authenticate with below — the base
      # file's empty default here is what would otherwise create both logins with no password.
      #
      # These also satisfy CHECK_POLICY = ON, which the init script sets deliberately rather than
      # switching complexity off for development: a login created with a weak password in
      # development and a strong one in production is two different setups, and only one of them
      # gets tested.
      GYMOS_MIGRATOR_PASSWORD: ${GYMOS_MIGRATOR_PASSWORD:-Gymos_dev_migrator_password1}
      GYMOS_APP_PASSWORD: ${GYMOS_APP_PASSWORD:-Gymos_dev_app_password1}

  api:
    environment:
      # Development enables the developer exception page, verbose framework logging, and the
      # deliberately public JWT signing key from appsettings.Development.json — which is why no
      # signing key needs configuring to boot this stack.
      #
      # Note what is NOT set here: Security__Jwt__SigningKey. Setting it to an empty value would
      # override the file-based development key (environment beats appsettings.json), and the
      # application would refuse to start. If you want to test with a real key, set
      # GYMOS_JWT_SIGNING_KEY in .env and uncomment the line below.
      #Security__Jwt__SigningKey: ${GYMOS_JWT_SIGNING_KEY}
      ASPNETCORE_ENVIRONMENT: Development

      # The local sidecar, and deliberately nothing else.
      #
      # **`GYMOS_DB_CONNECTION` used to be honoured here and is not any more.** It existed so a
      # developer could point the local API at a shared external database — a team dev instance, and
      # in practice a free Neon PostgreSQL one. That is now exactly the thing the environment model
      # forbids: local development talks to GymOS_Local, UAT to GymOS_UAT, production to
      # GymOS_Production, and there is no fourth database and no path between them. An override that
      # silently redirected the local stack somewhere shared is how a developer ends up writing to
      # an environment they did not mean to, and the redirect left no trace in the compose file.
      #
      # A developer who genuinely needs a different local target changes this line in their working
      # copy, which is visible in `git diff` rather than invisible in `.env`. Anything beyond that is
      # a deployment, and deployments do not run from this overlay.
      #
      # Connects as gymos_app — which owns nothing and cannot disable a security policy, unlike the
      # sa login. TrustServerCertificate=True here and nowhere else: the sidecar generates a
      # self-signed certificate on first boot, so verification cannot succeed against it. Production
      # leaves it off and verifies for real.
      ConnectionStrings__Database: >-
        Server=mssql,1433;Database=${GYMOS_DB:-GymOS_Local};User Id=gymos_app;Password=${GYMOS_APP_PASSWORD:-Gymos_dev_app_password1};Encrypt=True;TrustServerCertificate=True;Current
        Language=us_english

      # Off, here too: migrations are the migrator service's job now (see its definition below),
      # so "one command" (`docker compose up -d`) still brings up a fresh clone fully migrated —
      # it just does it in its own container instead of as a side effect of the API starting.
      Database__MigrateOnStartup: 'false'

      # A working sign-in without a setup step. Public by design, like everything else here; the
      # seeder creates this account once and never resets it, so changing the password inside the
      # application sticks.
      Seed__SuperAdmin__Email: ${GYMOS_SEED_ADMIN_EMAIL:-admin@gymos.local}
      Seed__SuperAdmin__Password: ${GYMOS_SEED_ADMIN_PASSWORD:-gymos-dev-admin-password}

      # Human-readable console output. Production emits JSON; this is the one place where being
      # different from production is the point, because `docker compose logs -f api` is read by a
      # person. Set GYMOS_LOG_FORMAT=json in .env to see exactly what production would emit.
      Serilog__ConsoleFormat: ${GYMOS_LOG_FORMAT:-text}
      Serilog__MinimumLevel__Default: ${GYMOS_LOG_LEVEL:-Information}

      # Argon2id at its floor. Production values (19456 KiB, 2 iterations) cost ~100 ms per
      # sign-in by design; on a laptop running the whole stack that is felt on every request
      # during development, and the cost parameters have their own unit tests.
      Security__PasswordHashing__MemorySizeKib: '8192'
      Security__PasswordHashing__Iterations: '1'

      # Generous, because a developer signing in repeatedly while working on the console will
      # otherwise trip the production-appropriate limit of 10 per minute.
      Security__RateLimiting__SignInAttemptsPerWindow: '200'

      # ── Email (ADR-53) ────────────────────────────────────────────────────────────────────────
      # On, pointed at the Mailpit sidecar. Inviting an administrator is the only way to create a
      # usable account, and the invitation is what makes it usable — so a stack where email does
      # nothing is a stack where the first thing anyone tries silently fails. Nothing leaves the
      # machine: Mailpit captures mail instead of delivering it.
      Email__Enabled: 'true'
      # `mailpit`, not localhost: containers reach each other by service name on the compose
      # network, and 1025 here is the container port rather than the published one.
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: '1025'
      Email__From__Address: ${GYMOS_EMAIL_FROM:-platform@gymos.local}
      Email__From__DisplayName: 'GymOS Platform'
      # Every activation link is built from this, and it is followed by a *browser on the host*, so
      # it must be a host-reachable URL for the console — not a compose service name. Defaults to
      # the console's own dev port; set GYMOS_CONSOLE_URL in .env if you run it elsewhere.
      Email__ConsoleBaseUrl: ${GYMOS_CONSOLE_URL:-http://localhost:3000}

    ports:
      # 5080 matches the port `dotnet run` uses via launchSettings.json, so a URL from the README
      # or a colleague works whether the API is running in a container or on the host.
      - '${API_PORT:-5080}:8080'

    # read_only stays on in development too. A setting that only applies in production is a
    # setting whose failure mode is discovered in production — if the application starts needing
    # to write somewhere, it should fail here first, on a laptop, with someone watching.

  migrator:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Public development password, matching how api's gymos_app default above works. sa never
      # appears here — the migrator owns the schemas as gymos_migrator, created by
      # docker/sqlserver/initdb/10-principals.sql before this service runs.
      ConnectionStrings__Database: >-
        Server=mssql,1433;Database=${GYMOS_DB:-GymOS_Local};User Id=gymos_migrator;Password=${GYMOS_MIGRATOR_PASSWORD:-Gymos_dev_migrator_password1};Encrypt=True;TrustServerCertificate=True;Current
        Language=us_english

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  # Development-only tooling
  # ══════════════════════════════════════════════════════════════════════════════════════════════
  #
  # Mailpit: the API sends mail as part of creating a usable administrator (ADR-53), so it is part
  # of the development baseline rather than optional tooling behind a profile. It is defined here
  # rather than in the base file because it does not belong in production — its purpose is to
  # *capture* mail instead of delivering it.
  #
  # ── There is no database console container, and that is a removal, not an omission ────────────
  # pgAdmin used to sit here behind the `tools` profile. It speaks the PostgreSQL wire protocol and
  # nothing else, so the migration to SQL Server left nothing to point it at. It was dropped rather
  # than swapped for the nearest equivalent, on the same dependency-policy grounds the rest of this
  # repository applies: the obvious replacements are either GPL-licensed or another always-on HTTP
  # service holding database credentials, and neither earns its place for a job three tools already
  # do better.
  #
  # The database is published on ${MSSQL_PORT:-1433}, so connect to it directly with whichever of
  # these is already installed:
  #
  #     sqlcmd            docker compose exec mssql /opt/mssql-tools18/bin/sqlcmd \
  #                           -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -d gymos
  #     Azure Data Studio / SSMS / JetBrains DataGrip / VS Code mssql extension
  #                       localhost,1433 — sa / Gymos_dev_sa_password1 — Trust server certificate
  #
  # PGADMIN_* variables are gone from .env.example for the same reason.

  mailpit:
    image: axllent/mailpit:latest
    container_name: gymos-mailpit
    # No profile: since ADR-53 the API sends mail on the one path that creates a
    # usable administrator, so a stack without somewhere to send it is a broken stack rather than a
    # leaner one. It is also what makes F5 self-sufficient — the whole flow, including the
    # invitation, works with nothing else started by hand.
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    # Nothing to write and nothing privileged to do — messages are held in memory and both listeners
    # are above 1024 — so it has no reason to be root. The image defaults to root; this overrides it.
    user: '1000:1000'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP, for the application to send to
      - '${MAILPIT_UI_PORT:-8025}:8025' # web UI, for a human to read
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8025/readyz']
      interval: 15s
      timeout: 5s
      retries: 5
    <<: *default-hardening
    networks:
      - gymos-data

  # ── Optional services: host ports, development only ─────────────────────────────────────────
  #
  # The base file defines what these services are; publishing them is an environment decision, so
  # it happens here. A profile that is off costs nothing, and none of these is reachable from the
  # host in production even if its profile is enabled there.
  #
  # Compose merges by service name, so these blocks add ports to the base definitions without
  # repeating them — including `profiles`, which is inherited.

  redis:
    ports:
      - '${REDIS_PORT:-6379}:6379'

  seq:
    environment:
      # Public development value, so the observability profile starts without a .env. Sign in as
      # `admin`.
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-gymos-dev-seq}
    ports:
      - '${SEQ_UI_PORT:-8341}:80' # web UI
      - '${SEQ_INGEST_PORT:-5341}:5341' # ingestion, for a host-run API to log into

  minio:
    environment:
      # Development default, so the storage profile starts without a .env. MinIO refuses to boot
      # with a root password shorter than 8 characters, which is why the base file's empty default
      # is not enough on its own.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gymos-dev-minio}
    ports:
      - '${MINIO_API_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # web console
